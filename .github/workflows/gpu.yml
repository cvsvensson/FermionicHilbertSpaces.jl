name: GPU
# Runs on PRs labelled `gpu`, on tags, and by hand: `gh workflow run gpu.yml --ref <branch>`.
on:
  pull_request:
    types: [labeled, synchronize]
  push:
    tags: ['*']
  workflow_dispatch:
jobs:
  gpu:
    name: GPU-like arrays (JLArrays)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'gpu') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'gpu'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - run: julia --color=yes --code-coverage=user --project=test/gpu -e 'using Pkg; Pkg.instantiate(); include("test/gpu/runtests.jl")'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
