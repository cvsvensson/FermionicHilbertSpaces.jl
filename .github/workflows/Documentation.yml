name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Runners have varying CPUs; native-target pkgimages from the cache are rejected on a different CPU.
      JULIA_CPU_TARGET: generic
      # BitPermutations picks BMI2/AVX-512 intrinsics from the host CPU, which fail to compile for the generic target.
      BIT_PERMUTATIONS_USE_INTRINSICS: false
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          # Pkgimages built with other settings above are not detected as stale and fail to load, so they get their own cache.
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=generic;bitpermutations-intrinsics=false
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
