name: Format
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runic:
    name: Runic (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install Runic
        run: |
          julia --project=@runic -e 'using Pkg; Pkg.add("Runic")'
          RUNIC_DIR=$(julia --project=@runic -e 'using Runic; print(pkgdir(Runic))')
          install -m 755 "$RUNIC_DIR/bin/git-runic" /usr/local/bin/git-runic
      - name: Format lines changed by this PR
        run: |
          git fetch origin ${{ github.base_ref }}
          # git-runic exits with 1 when it reformatted files; only 2 is an error.
          git runic "$(git merge-base origin/${{ github.base_ref }} HEAD)" || [ $? -eq 1 ]
      - name: Push formatting commit, or fail with the diff for forks
        env:
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          if [ "$SAME_REPO" != true ]; then
            git diff
            echo "::error::Changed lines are not Runic-formatted. Run 'git runic origin/main' locally and push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Format changed lines with Runic"
          git push origin HEAD:"$HEAD_REF"
