name: Benchmark this PR
# Runs on PRs labelled `performance`, on a `/benchmark` comment, or by hand: `gh workflow run benchmark.yml -f pr=<number>`.
on:
  pull_request_target:
    types: [labeled, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  pull-requests: write    # needed to post comments

jobs:
  bench:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'performance') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'performance')) ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/benchmark') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Find the PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.issue.number || github.event.pull_request.number }}
        run: |
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid)" >> "$GITHUB_OUTPUT"

      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          rev: ${{ github.event.repository.default_branch }},${{ steps.pr.outputs.sha }}
          julia-version: '1'
          job-summary: 'true' # the full tables go into the comment below, folded

      # The report script comes from the default branch, not from the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base-checkout
          sparse-checkout: benchmark
          persist-credentials: false

      - name: Summarize the benchmarks
        shell: bash
        env:
          GITHUB_TOKEN: ""
          BASE_REV: ${{ github.event.repository.default_branch }}
          HEAD_REV: ${{ steps.pr.outputs.sha }}
        run: |
          {
            julia base-checkout/benchmark/ci_report.jl "$BASE_REV" "$HEAD_REV"
            echo "<details><summary>All benchmarks</summary>"
            echo ""
            tail -n +3 body.md
            echo "</details>"
          } > report.md

      - name: Comment on the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- performance-regressions -->'
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          body="$marker"$'\n'"$(cat report.md)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
