name: Benchmark this PR
on:
  pull_request_target:
    branches: [ main ]  # change to your default branch
permissions:
  pull-requests: write    # needed to post comments

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          job-summary: 'true' # the full tables go into the comment below, folded

      # The report script comes from the default branch, not from the PR.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base-checkout
          sparse-checkout: benchmark
          persist-credentials: false

      - name: Summarize the benchmarks
        shell: bash
        env:
          GITHUB_TOKEN: ""
          BASE_REV: ${{ github.event.repository.default_branch }}
          HEAD_REV: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            julia base-checkout/benchmark/ci_report.jl "$BASE_REV" "$HEAD_REV"
            echo "<details><summary>All benchmarks</summary>"
            echo ""
            tail -n +3 body.md
            echo "</details>"
          } > report.md

      - name: Comment on the PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- performance-regressions -->'
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          body="$marker"$'\n'"$(cat report.md)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
